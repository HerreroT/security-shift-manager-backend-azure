# Local environment: backend + PostgreSQL. Usage (see docs/docker.md):
#   copy .env.example .env      (and change the secrets)
#   docker compose up -d --build
# The API is then available at http://localhost:8090 (Swagger: /swagger-ui.html, health: /actuator/health).
name: shiftmanager

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: shiftmanager
      POSTGRES_USER: ${DB_USERNAME:-shiftmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # Named volume: the data survives "docker compose down" (only "down -v" deletes it).
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    # No published port: only the backend can reach the database through the internal network.
    # To inspect it from the PC (DBeaver, psql) uncomment:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d shiftmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./shiftmanager
      args:
        VERSION: ${APP_VERSION:-local}
    image: shiftmanager-backend:${APP_VERSION:-local}
    # Same architecture as Azure Container Apps.
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/shiftmanager
      DB_USERNAME: ${DB_USERNAME:-shiftmanager}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shiftmanager.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${PORT:-8090}:8090"
    networks:
      - backend
    # The health check is defined in the Dockerfile (HEALTHCHECK against /actuator/health);
    # "docker compose ps" shows it as healthy / unhealthy.

networks:
  backend:

volumes:
  pgdata:
