name: CodeQL

# Static analysis of the source code (SAST). Results: Security tab -> Code scanning.
# Complements Grype, which analyzes the packages inside the Docker image.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '0 6 * * 1'   # every Monday, to catch new queries on unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Análisis CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the results to Code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none      # analyzes the Java sources without compiling
          - language: actions     # the GitHub Actions workflows themselves
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
