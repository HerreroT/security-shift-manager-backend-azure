name: CI

on:
  push:
    branches: [dev, main, deploy]
  pull_request:
    branches: [dev, main, deploy]

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiftmanager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build y tests
        run: ./gradlew build --no-daemon

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t shiftmanager-backend ./shiftmanager
