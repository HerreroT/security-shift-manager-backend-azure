name: CI/CD

# When does each stage run (see docs/ci-cd.md):
#   pull request to dev/main/deploy -> tests + image + Grype                (nothing is published)
#   push to dev or main             -> tests + image + Grype + push to ACR  (CASE A: image without deploy)
#   push to deploy                  -> the same + deploy to Azure           (CASE B: CI + CD)
#   tag vX.Y.Z                      -> image published as :<sha> and :vX.Y.Z (no deploy)
#   Run workflow (manual)           -> choose whether to deploy, and optionally an existing tag (CASE C / rollback)
# The repository variable CD_ENABLED=false turns every deploy off without editing this file.
on:
  push:
    branches: [dev, main, deploy]
    tags: ['v*.*.*']
  pull_request:
    branches: [dev, main, deploy]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Desplegar en Azure Container Apps'
        type: boolean
        default: false
      image_tag:
        description: 'Tag existente en el ACR para desplegar sin construir (ej. 1a2b3c4 o v1.0.0). Vacío = construir el commit actual'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_NAME }}

jobs:
  test:
    name: Build y tests
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiftmanager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Compilar y ejecutar los tests
        run: ./gradlew build --no-daemon
      - name: Guardar el reporte de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-tests
          path: shiftmanager/build/reports/tests/test
          retention-days: 14

  image:
    name: Imagen, Grype y push al ACR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v7

      # Same naming as scripts/azure_manager.py: :<7-char sha> always, plus :vX.Y.Z for version tags.
      - name: Calcular tags y metadatos
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          TAGS="$IMAGE:$SHA_TAG"
          VERSION="$SHA_TAG"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAGS="$TAGS $IMAGE:$GITHUB_REF_NAME"
            VERSION="$GITHUB_REF_NAME"
          fi
          {
            echo "sha_tag=$SHA_TAG"
            echo "tags=$TAGS"
            echo "version=$VERSION"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Docker build (linux/amd64, etiquetas OCI)
        run: |
          TAG_ARGS=()
          for t in ${{ steps.meta.outputs.tags }}; do TAG_ARGS+=(-t "$t"); done
          docker build --platform linux/amd64 \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.created }} \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg SOURCE_URL=${{ github.server_url }}/${{ github.repository }} \
            "${TAG_ARGS[@]}" ./shiftmanager

      # Full report (every severity) for the logs and as an artifact; it never fails the build.
      - name: Grype - informe completo
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype-report
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          grype-version: v0.120.1
          fail-build: false
          output-format: table
          output-file: grype-report.txt
      - name: Publicar el informe de Grype
        if: always()
        run: |
          {
            echo "## Grype: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}"
            echo '```'
            head -n 60 grype-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grype-report
          path: grype-report.txt
          retention-days: 30

      # Security gate: fails if there is a High/Critical vulnerability that already has a fix.
      - name: Grype - control de seguridad (altas/críticas con corrección)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Login en Azure (Service Principal)
        if: github.event_name != 'pull_request'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push al ACR
        if: github.event_name != 'pull_request'
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          for t in ${{ steps.meta.outputs.tags }}; do docker push "$t"; done
          {
            echo "## Imagen publicada"
            for t in ${{ steps.meta.outputs.tags }}; do echo "- \`$t\`"; done
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy a Azure Container Apps
    needs: image
    # always() lets this job run when "image" was skipped (manual deploy of an existing tag),
    # but only if nothing before it failed.
    if: >-
      always() && !failure() && !cancelled()
      && vars.CD_ENABLED != 'false'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/deploy')
        || (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Elegir la imagen
        id: pick
        run: |
          TAG="${{ inputs.image_tag }}"
          if [[ -z "$TAG" ]]; then TAG="${{ needs.image.outputs.tag }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Imagen a desplegar: $IMAGE:$TAG"

      - name: Login en Azure (Service Principal)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verificar que la imagen existe en el ACR
        run: |
          az acr repository show --name ${{ vars.ACR_NAME }} --image "${{ vars.IMAGE_NAME }}:${{ steps.pick.outputs.tag }}" \
            --query "{tag:'${{ steps.pick.outputs.tag }}', digest:digest, creada:createdTime}" -o table

      - name: Nueva revisión con la imagen
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g ${{ vars.AZURE_RESOURCE_GROUP }} -n ${{ vars.CONTAINER_APP_NAME }} \
            --image "$IMAGE:${{ steps.pick.outputs.tag }}" -o none

      - name: Verificar que la versión nueva responde
        run: |
          FQDN=$(az containerapp show -g ${{ vars.AZURE_RESOURCE_GROUP }} -n ${{ vars.CONTAINER_APP_NAME }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          TAG="${{ steps.pick.outputs.tag }}"
          for _ in $(seq 1 36); do
            INFO=$(curl -s -m 20 "https://$FQDN/actuator/info" || true)
            # The tag is either the version (sha or vX.Y.Z) or the beginning of the commit of the image.
            if echo "$INFO" | grep -qE "\"version\":\"$TAG\"|\"commit\":\"$TAG"; then
              echo "OK: https://$FQDN responde con la versión $TAG"
              curl -s "https://$FQDN/actuator/health"; echo
              {
                echo "## Deploy"
                echo "- URL: https://$FQDN"
                echo "- Imagen: \`$IMAGE:$TAG\`"
                echo "- /actuator/info: \`$INFO\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "La versión $TAG no respondió en 6 minutos. Última respuesta: $INFO"
          exit 1
