spring.application.name=shiftmanager

# Default database: H2 in memory (PostgreSQL mode), so the app runs without installing anything.
# Data is lost on restart. For a persistent database use the "postgres" profile
# (see application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:shiftmanager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The schema is created by Flyway migrations (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Dev-only secret. Must be overridden via env var for any non-local deployment.
security.jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-32bytes-min}
# Token lifetime in milliseconds (default 24 h).
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# First administrator, created only when there are no users. Override both in production.
app.admin.email=${ADMIN_EMAIL:admin@shiftmanager.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Loads example guards, services and shifts on startup (only if the database has no guards).
app.seed-demo-data=${SEED_DEMO_DATA:true}

# Comma separated origins allowed by CORS (Expo web, Swagger). Native apps are not affected.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Listen on every network interface so a phone running Expo Go can reach http://<PC-IP>:8090 (8080 is often taken on Windows, 8081 is used by Expo)
server.address=0.0.0.0
server.port=${PORT:8090}
# Finish in-flight requests before stopping (Azure Container Apps stops old revisions with SIGTERM).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: health and info are public (used by Docker and Azure health probes);
# metrics only for ADMIN (see SecurityConfig). Health details are shown only to ADMIN.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
# Version and commit of the running image, injected by the Docker build (see Dockerfile).
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:dev}
info.app.commit=${GIT_COMMIT:unknown}
