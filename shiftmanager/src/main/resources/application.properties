spring.application.name=shiftmanager
spring.datasource.url=jdbc:h2:mem:shiftmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dev-only secret. Must be overridden via env var for any non-local deployment.
security.jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-32bytes-min}
security.jwt.expiration-ms=86400000
