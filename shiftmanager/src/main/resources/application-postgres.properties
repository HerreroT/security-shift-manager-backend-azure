# Local PostgreSQL profile for development. Activate with SPRING_PROFILES_ACTIVE=postgres.
# Connection data comes from environment variables; the defaults are only for a local database.
# Deployments use the "prod" profile (application-prod.properties), which has no defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shiftmanager}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:shiftmanager}
spring.datasource.password=${DB_PASSWORD:shiftmanager}
