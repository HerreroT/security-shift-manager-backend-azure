# PostgreSQL profile. Activate with SPRING_PROFILES_ACTIVE=postgres (or --spring.profiles.active=postgres).
# Connection data comes from environment variables; the defaults match docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shiftmanager}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:shiftmanager}
spring.datasource.password=${DB_PASSWORD:shiftmanager}
