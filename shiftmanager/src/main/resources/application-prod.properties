# Production profile (Docker image and Azure Container Apps). Activate with SPRING_PROFILES_ACTIVE=prod.
# Secrets have NO default values on purpose: if one is missing the application refuses to start
# ("Could not resolve placeholder ...") instead of running with a known development value.
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

security.jwt.secret=${JWT_SECRET}

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

app.seed-demo-data=${SEED_DEMO_DATA:false}

# One line per HTTP request on stdout (12-factor logs), so Azure Log Analytics can answer
# "did the request arrive?", "what status?" and "how long did it take?". Example:
#   ACCESS 190.2.3.4 "POST /api/auth/login HTTP/1.1" 200 705 87ms
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.buffered=false
# %{X-Forwarded-For}i: client IP behind the Azure ingress; %{ms}T: processing time in milliseconds.
server.tomcat.accesslog.pattern=ACCESS %{X-Forwarded-For}i "%r" %s %b %{ms}Tms
