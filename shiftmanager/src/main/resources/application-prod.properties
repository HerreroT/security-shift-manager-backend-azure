# Production profile (Docker image and Azure Container Apps). Activate with SPRING_PROFILES_ACTIVE=prod.
# Secrets have NO default values on purpose: if one is missing the application refuses to start
# ("Could not resolve placeholder ...") instead of running with a known development value.
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

security.jwt.secret=${JWT_SECRET}

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

app.seed-demo-data=${SEED_DEMO_DATA:false}
